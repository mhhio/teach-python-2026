[project]
name = "teach-python-2026"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "seaborn>=0.13.2",
]

[tool.uv]
python-preference = "only-managed"  # python.org build on this Mac lacks SSL certs -> dataset downloads fail
